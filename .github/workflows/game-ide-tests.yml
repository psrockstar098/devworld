name: Game IDE tests

on:
  push:
    paths: ['game-ide/**', '.github/workflows/game-ide-tests.yml']
  pull_request:
    paths: ['game-ide/**']
  workflow_dispatch:

jobs:
  test:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test game-ide/tests/
