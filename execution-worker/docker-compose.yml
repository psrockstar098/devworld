# DEVWORLD execution worker.
#
# IMPORTANT: the worker spawns sibling containers through the host Docker
# daemon, so the submissions directory must resolve to the SAME absolute
# path on the host and inside this container. Create /submissions on the
# host first (sudo mkdir -p /submissions), or point SUBMISSIONS_DIR at
# another host path that you bind-mount 1:1 here.

services:
  worker:
    build: .
    image: devworld/execution-worker:latest
    container_name: devworld-execution-worker
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The worker asks the host daemon to bind-mount scratch dirs from
      # SUBMISSIONS_DIR, so that path must resolve identically on the host and
      # in this container — hence the same variable on both sides.
      # Default is /submissions (create it on the host: sudo mkdir -p
      # /submissions). Without sudo, set SUBMISSIONS_DIR=$HOME/devworld-submissions.
      - ${SUBMISSIONS_DIR:-/submissions}:${SUBMISSIONS_DIR:-/submissions}
    env_file:
      - path: .env
        required: false
    environment:
      SUBMISSIONS_DIR: ${SUBMISSIONS_DIR:-/submissions}
      # Store/event wiring. Hostnames resolve on the external `devworld` network.
      KV_URL: redis://:${KV_PASSWORD:-devworld_dev_pw}@kv:6666
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-devworld}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-devworld}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-devworld_dev_pw}
    restart: unless-stopped
    networks: [devworld]

networks:
  devworld:
    name: devworld
    external: true
